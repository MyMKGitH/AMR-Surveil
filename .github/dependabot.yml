version: 2
# Dependabot proposes updates as pull requests, but never merges anything by itself.
# Kept deliberately quiet: monthly, few open PRs, no automatic Python-version or minimum-version bumps.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    versioning-strategy: increase-if-necessary   # do not raise the minimum supported version needlessly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "python"   # the tested interpreter is chosen by the author, not by a bot
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
