[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amr-surveil"
version = "1.1.1"
description = "Reproducible genomic and epidemiological antimicrobial resistance surveillance workbench with screened-sample genotype-phenotype analysis, comparability flags and provenance manifests"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Moad Khalifa"}]
keywords = ["antimicrobial resistance", "AMR", "microbial genomics", "surveillance", "One Health", "bioinformatics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: Streamlit",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "pandas>=2.2.3,<4.0",
  "numpy>=1.26,<3.0",
  "PyYAML>=6.0,<7.0",
  "streamlit>=1.40,<2.0",
  "plotly>=5.24,<8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.8,<1.0",
  "psutil>=5.9,<8.0",
  "jsonschema>=4.20,<5.0",
]

[project.scripts]
amr-surveil = "amr_surveil.cli:main"

[tool.setuptools.packages.find]
include = ["amr_surveil*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
filterwarnings = ["error::FutureWarning", "error::DeprecationWarning:amr_surveil"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
